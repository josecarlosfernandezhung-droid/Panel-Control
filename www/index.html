<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a33">
<title>Catálogo de Productos</title>
<link rel="manifest" href="manifest-panel.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--b:#0a7c86;--b2:#0f2a33;--a:#ffb020;--bg:#f2f6f6;--card:#fff;--ink:#14212b;--mut:#62727d;--line:#e1e8eb;--soft:#e6f3f4;--ok:#15803d;--bad:#b91c1c;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block}
a{color:var(--b)}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;background:var(--bg);position:relative}
.top{flex:0 0 auto;background:var(--b2);color:#fff;display:flex;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;min-height:58px}
.top h1{flex:1;margin:0;font-size:19px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{width:42px;height:42px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center}
.top .ib:active{background:rgba(255,255,255,.14)}
.top .ib+.ib{margin-left:2px}
#view{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg{padding:14px 14px 28px}
.stack>*+*{margin-top:12px}
.hz{display:flex;align-items:center}
.hz>*+*{margin-left:10px}
.sp{flex:1;min-width:0}
.wr{display:flex;flex-wrap:wrap;margin:-4px}
.wr>*{margin:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{padding:0;overflow:hidden}
.card h2{margin:0 0 4px;font-size:16px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.help{font-size:13px;color:var(--mut)}
.mut{color:var(--mut)}
.bold{font-weight:750}
.tc{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.btn>svg{margin-right:8px}
.btn.pri{background:var(--b);color:#fff;border-color:transparent}
.btn.acc{background:var(--a);color:#3b2300;border-color:transparent}
.btn.dan{background:#fee2e2;color:#991b1b;border-color:transparent}
.btn.wa{background:#25d366;color:#05301a;border-color:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.blk{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.in{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:none;display:block}
.in:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(10,124,134,.15)}
textarea.in{padding:10px 12px;min-height:84px;resize:vertical}
select.in{padding-right:8px}
.lbl{display:block;font-weight:700;font-size:13px;margin:14px 0 5px;color:#33444f}
.lbl:first-child{margin-top:0}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:750;background:var(--soft);color:#0b5c64}
.chip.ok{background:#dcfce7;color:#166534}.chip.bad{background:#fee2e2;color:#991b1b}.chip.warn{background:#fef3c7;color:#92400e}.chip.gray{background:#e8edf0;color:#475569}
.fl{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.fl::-webkit-scrollbar{display:none}
.fl>button{flex:0 0 auto;margin-right:8px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:650;font-size:14px;white-space:nowrap}
.fl>button.on{background:var(--b2);color:#fff;border-color:transparent}
/* lista */
.li{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);min-height:62px}
.li:last-child{border-bottom:0}
.li .th{width:50px;height:50px;border-radius:12px;background:var(--soft);flex:0 0 50px;overflow:hidden;margin-right:12px;display:flex;align-items:center;justify-content:center;color:var(--b);font-weight:800}
.li .th img{width:100%;height:100%;object-fit:cover}
.lgo{background:#fff;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--b);font-weight:800}
.lgo img{width:100%;height:100%;object-fit:contain}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ib2{width:40px;height:40px;border-radius:11px;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.li .ib2[disabled]{opacity:.25}
.li .ib2.dg{color:var(--bad)}
a.li,.li.tap{cursor:pointer;color:inherit;text-decoration:none}
/* interruptor */
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:0 0 46px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;left:0;top:0;right:0;bottom:0;background:#cbd5db;border-radius:99px;transition:.15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--b)}
.sw input:checked+i:after{left:21px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .l b{display:block}
.opt .l span{font-size:13px;color:var(--mut)}
/* nav inferior */
.nav{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom));position:relative}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-size:11.5px;font-weight:650;text-decoration:none;min-height:50px;position:relative}
.nav a.on{color:var(--b)}
.nav a .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:#e11d48;color:#fff;font-size:10.5px;line-height:17px;text-align:center;padding:0 4px}
.nav .fab{flex:0 0 70px;margin:-26px 4px 0;height:62px;width:62px;border-radius:20px;background:var(--a);color:#3b2300;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(255,176,32,.45);align-self:flex-start}
/* kpi */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:22px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--b2),#165964);color:#fff;border-radius:20px;padding:16px;border:0}
.hero .help{color:#bcd3d8}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--b)}
.banner{border-radius:14px;padding:12px 14px;font-size:14px}
.banner.warn{background:#fff4d6;color:#7a4a00;border:1px solid #f6d98a}
.banner.info{background:var(--soft);color:#0b4f56;border:1px solid #cfe7ea}
.banner.bad{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
/* modal */
#mo{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(8,20,26,.55);z-index:50;display:none;align-items:flex-end}
#mo.on{display:flex}
.md{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.md h2{margin:0 0 10px;font-size:18px}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;background:#14212b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;display:none;max-width:90%;text-align:center}
#toast.bad{background:#b91c1c}
#busy{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(255,255,255,.75);z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;font-weight:700}
#busy.on{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--b);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
/* fotos del producto */
.pics{display:flex;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.pics::-webkit-scrollbar{display:none}
.pic{flex:0 0 96px;height:96px;border-radius:14px;background:var(--soft);margin-right:10px;position:relative;overflow:hidden;border:2px solid transparent}
.pic.main{border-color:var(--b)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .x{position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:26px;text-align:center}
.pic .m{position:absolute;left:0;right:0;bottom:0;background:rgba(10,124,134,.92);color:#fff;font-size:11px;text-align:center;padding:2px}
.pic.add{border:2px dashed #b9c9cf;background:transparent;color:var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer}
.pic.add svg{margin-bottom:4px}
.swatches{display:flex;flex-wrap:wrap;margin:-4px}
.swatches button{width:40px;height:40px;border-radius:12px;margin:4px;border:3px solid transparent}
.swatches button.on{border-color:var(--ink)}
.cov{height:120px;border-radius:14px 14px 0 0;background:var(--soft) center/cover;position:relative}
.cov img{width:100%;height:100%;object-fit:cover}
.lg{width:72px;height:72px;border-radius:18px;background:var(--b);color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:4px solid #fff;margin:-36px 0 0 12px}
.lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl input{min-height:38px}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:inline-block;border:1px solid var(--line)}
.pv{max-width:100%;border-radius:12px;border:1px solid var(--line)}
@media (min-width:760px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="shell" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  <div id="mo"><div class="md" id="md"></div></div>
  <div id="busy"><div class="spin"></div><div id="busyt">Un momento…</div></div>
  <div id="toast"></div>
</div>
<input type="file" id="filepick" accept="image/*" multiple style="display:none">
<input type="file" id="filecam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="filedoc" style="display:none">
<script src="config.js" onerror="void 0"></script>
<script>
/* ===== Catálogo de Productos · utilidades compartidas (catálogo + panel) ===== */
var TZ = 'America/Havana';
var DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
var MONEDAS = ['CUP', 'USD', 'EUR', 'MLC'];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var n = parseFloat(String(v == null ? '' : v).replace(/\s| /g, '').replace(',', '.'));
  return isFinite(n) ? n : 0;
}
function fmtNum(n, dec) {
  n = +n || 0; var neg = n < 0; n = Math.abs(n);
  var d = dec == null ? (Math.abs(n - Math.round(n)) < 0.005 ? 0 : 2) : dec;
  var p = n.toFixed(d).split('.');
  var i = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '-' : '') + i + (p[1] ? ',' + p[1] : '');
}
function fmtMoney(n, cur) { return fmtNum(n) + ' ' + cur; }

function uid() {
  var a = new Uint8Array(6);
  (self.crypto || window.crypto).getRandomValues(a);
  return Date.now().toString(36).slice(-5) + Array.prototype.map.call(a, function (b) { return (b % 36).toString(36); }).join('');
}
function hash32(s) { var h = 0x811c9dc5; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
function slugValido(s) { return /^[a-z0-9][a-z0-9-]{2,29}$/.test(s || ''); }
function slugDe(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30); }

/* Código de pedido: ordenable por fecha (8 de tiempo + 2 al azar) */
function pedidoCodigo() {
  var t = Date.now().toString(36); while (t.length < 8) t = '0' + t;
  var r = ''; for (var i = 0; i < 2; i++) r += Math.floor(Math.random() * 36).toString(36);
  return (t + r).toUpperCase();
}
function codigoVista(c) { c = String(c || ''); return c.length >= 10 ? c.slice(0, 5) + '-' + c.slice(5) : c; }

/* WhatsApp: acepta 5xxxxxxx, +53 5xxxxxxx, 53 5xxxxxxx, o número internacional */
function waNumero(s) {
  var d = String(s || '').split(/[\/,;\n]|\sy\s/)[0].replace(/\D/g, '');
  if (d.length === 8 && d[0] === '5') return '53' + d;
  return d;
}
/* Varios números separados por / , ; → lista de números válidos */
function waLista(s) {
  var out = []; String(s || '').split(/[\/,;\n]|\sy\s/).forEach(function (x) { var n = waNumero(x); if (n.length >= 10 && out.indexOf(n) < 0) out.push(n); }); return out;
}

/* Fecha/hora en La Habana (independiente de la zona del teléfono) */
function ahoraHabana(date) {
  var d = date || new Date();
  var f = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false, weekday: 'short' }).formatToParts(d);
  var o = {}; f.forEach(function (p) { o[p.type] = p.value; });
  var dow = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[o.weekday];
  var hh = +o.hour % 24;
  return { fecha: o.year + '-' + o.month + '-' + o.day, dia: o.year + o.month + o.day, dow: dow, min: hh * 60 + (+o.minute) };
}
function hm(s) { var m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function hmTxt(s) { var m = hm(s); if (m == null) return ''; var h = Math.floor(m / 60), mm = m % 60, suf = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + String(mm).padStart(2, '0') + ' ' + suf; }

/* Horario por defecto: lunes a sábado 9:00-18:00 */
function horarioBase() { var a = []; for (var i = 0; i < 7; i++) a.push({ c: i === 0, a: '09:00', z: '18:00' }); return a; }

/* Clave de comparación de un SKU/código: sin acentos ni espacios y, si es solo número, sin ceros a la izquierda (Excel los quita) */
function skuKey(s) {
  var b = norm(String(s == null ? '' : s)).replace(/\s+/g, '');
  return /^\d+$/.test(b) ? String(parseInt(b, 10)) : b;
}

/* Firebase devuelve las listas como objetos {0:..,1:..} (o las omite si están vacías): siempre a arreglo */
function arr(x) {
  if (Array.isArray(x)) return x;
  if (x && typeof x === 'object') { return Object.keys(x).filter(function (k) { return /^\d+$/.test(k); }).sort(function (a, b) { return a - b; }).map(function (k) { return x[k]; }); }
  return [];
}

/* ¿Abierto ahora? -> {abierto, texto, temporal} */
function estadoTienda(t, date) {
  if (t.cierre) return { abierto: false, temporal: true, texto: 'Cerrada temporalmente' };
  t.hor = arr(t.hor); if (!t.hor.length) return { abierto: null, texto: '' };
  var n = ahoraHabana(date);
  function regla(offset) {
    var dd = new Date((date || new Date()).getTime() + offset * 86400000);
    var x = ahoraHabana(dd);
    var esp = arr(t.esp).filter(function (e) { return e.f === x.fecha; })[0];
    var base = t.hor[x.dow] || { c: true };
    return esp ? { c: !!esp.c, a: esp.a, z: esp.z, motivo: esp.m } : { c: !!base.c, a: base.a, z: base.z };
  }
  var hoy = regla(0);
  var a = hm(hoy.a), z = hm(hoy.z);
  if (!hoy.c && a != null && z != null) {
    var abierto = z > a ? (n.min >= a && n.min < z) : (n.min >= a || n.min < z);
    if (abierto) return { abierto: true, texto: 'Abierto hasta las ' + hmTxt(hoy.z) };
    if (n.min < a) return { abierto: false, texto: 'Cerrado · abre hoy a las ' + hmTxt(hoy.a) };
  }
  for (var i = 1; i <= 7; i++) {
    var r = regla(i);
    if (!r.c && hm(r.a) != null) {
      var dd = new Date((date || new Date()).getTime() + i * 86400000);
      var cuando = i === 1 ? 'mañana' : 'el ' + DIAS[ahoraHabana(dd).dow].toLowerCase();
      return { abierto: false, texto: 'Cerrado · abre ' + cuando + ' a las ' + hmTxt(r.a) };
    }
  }
  return { abierto: false, texto: 'Cerrado' };
}

/* ---- Monedas ----
   tasas: { USD: 540, EUR: 590, MLC: 200 }  (CUP por 1 unidad, ya con margen) */
function rateCUP(tasas, cur) { return cur === 'CUP' ? 1 : ((tasas && tasas[cur]) || 0); }
function convertir(monto, de, a, tasas) {
  if (de === a) return monto;
  var rd = rateCUP(tasas, de), ra = rateCUP(tasas, a);
  if (!rd || !ra) return null;
  return monto * rd / ra;
}
function redondear(monto, cur) {
  if (cur === 'CUP') return monto >= 50 ? Math.round(monto / 5) * 5 : Math.round(monto);
  return Math.round(monto * 100) / 100;
}
/* Precio vigente de un producto (con oferta si no venció) */
function precioVigente(p, hoy) {
  var of = p.of;
  if (of && num(of.p) > 0 && num(of.p) < num(p.p) && (!of.h || of.h >= hoy)) return { precio: num(of.p), antes: num(p.p), oferta: true };
  return { precio: num(p.p), antes: 0, oferta: false };
}
/* Valor mostrado: moneda propia del producto + equivalente en la otra moneda de la tienda */
function precioVista(monto, cur, t) {
  var main = { amt: monto, cur: cur }, alt = null;
  var mp = t.mp || 'CUP', ms = t.ms || '';
  var otra = cur === mp ? ms : mp;
  if (otra && otra !== cur) {
    var v = convertir(monto, cur, otra, t.tasas);
    if (v != null && v > 0) alt = { amt: redondear(v, otra), cur: otra };
  }
  return { main: main, alt: alt };
}
function textoPrecio(monto, cur, t) {
  var v = precioVista(monto, cur, t);
  return fmtMoney(v.main.amt, v.main.cur) + (v.alt ? ' (≈ ' + fmtMoney(v.alt.amt, v.alt.cur) + ')' : '');
}

/* Iniciales para avatar */
function iniciales(s) { var w = String(s || '?').trim().split(/\s+/).filter(Boolean); return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase(); }

/* Color: contraste de texto sobre un color de fondo */
function colorOn(hex) {
  var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#fff';
  var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 165 ? '#102033' : '#ffffff';
}
function mezclar(hex, w, to) { /* mezcla hex con blanco (to='#fff') o negro */
  var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return hex; var n = parseInt(m[1], 16);
  var t = to === '#000' ? 0 : 255, r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  function f(c) { return Math.round(c + (t - c) * w); }
  return '#' + [f(r), f(g), f(b)].map(function (c) { return c.toString(16).padStart(2, '0'); }).join('');
}

</script>

window.__CAT_TPL__ = "\u003c!doctype html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"theme-color\" content=\"#0a7c86\">\n\u003ctitle>Catálogo\u003c/title>\n\u003clink rel=\"manifest\" href=\"manifest.webmanifest\">\n\u003clink rel=\"icon\" href=\"icons/icon-192.png\">\n\u003cstyle>\n:root{--c:#0a7c86;--on:#fff;--bg:#f3f6f6;--card:#fff;--ink:#14212b;--mut:#62727d;--line:#e2e9ec;--soft:#e6f3f4;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--r:16px}\n@media (prefers-color-scheme:dark){:root{--bg:#0e1519;--card:#162027;--ink:#e8eff2;--mut:#93a4ae;--line:#25343d;--soft:#1b2b31}}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,sans-serif}\nbutton,input,select,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer;border:0;background:none;padding:0}\nimg{display:block}\n.wrap{max-width:1100px;margin:0 auto}\n/* cabecera */\n.cover{height:150px;background:linear-gradient(135deg,var(--c),var(--c2,#0b3a40));background-size:cover;background-position:center;position:relative}\n.cover img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}.cover img.err{display:none}.cover:after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,rgba(0,0,0,.18))}\n.hd{padding:0 16px 14px;margin-top:-38px;position:relative;z-index:1}\n.logo{width:76px;height:76px;border-radius:20px;border:4px solid var(--bg);background:var(--c);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;overflow:hidden}\n.logo img{width:100%;height:100%;object-fit:cover}\n.hd h1{margin:10px 0 2px;font-size:22px;line-height:1.2}\n.hd .fr{color:var(--mut);margin:0 0 8px}\n.chip{display:inline-block;padding:4px 10px;border-radius:99px;font-   var uidU = APP.auth.uid;
  setBusyText('Comprobando la dirección…');
  if (!st.slugOK) {
    var cur = await dbGet('slugs/' + st.slug);
    if (cur && cur.owner !== uidU) throw new Error('La dirección «' + st.slug + '» ya está en uso. Elige otra en Apariencia.');
    if (!cur) await dbCall('PUT', 'slugs/' + st.slug, { owner: uidU, sid: st.id, t: Date.now() });
    st.slugOK = true; save();
  }
  if (!opts.sinSync) { setBusyText('Sincronizando con tu nube…'); try { await privPull(st); } catch (e) { if (e.status === 401 || e.status === 403) throw e; } }
  setBusyText('Subiendo fotos…');
  await subirFotos(st, function (d, n) { setBusyText('Subiendo fotos… ' + d + '/' + n); });
  var pub = pubBody(st), body = {}, nh = {};
  Object.keys(pub).forEach(function (k) { var h = hash32(JSON.stringify(pub[k])); nh[k] = h; if (opts.force || st.pubHash[k] !== h) body[k] = pub[k]; });
  Object.keys(st.pubHash).forEach(function (k) { if (!(k in pub)) body[k] = null; });
  var vNow = Date.now(), nKeys = Object.keys(body).length;
  setBusyText('Publicando ' + (nKeys || 'sin') + ' cambio(s)…');
  var prodKeys = Object.keys(body).filter(function (k) { return k.indexOf('productos/') === 0; });
  var rest = {}; Object.keys(body).forEach(function (k) { if (k.indexOf('productos/') !== 0) rest[k] = body[k]; });
  var hashNow = Object.assign({}, st.pubHash);
  var pBody = {}; prodKeys.forEach(function (k) { pBody[k] = body[k]; });
  await patchPorLotes('catalogos/' + st.slug, pBody, 60, function (ks) { ks.forEach(function (k) { if (body[k] === null) delete hashNow[k]; else hashNow[k] = nh[k]; }); setBusyText('Publicando… ' + Object.keys(pBody).indexOf(ks[ks.length - 1]) + '/' + prodKeys.length); });
  rest.v = vNow; rest.pub = vNow;
  await dbCall('PATCH', 'catalogos/' + st.slug, rest, { ms: 60000 });
  Object.keys(rest).forEach(function (k) { if (k === 'v' || k === 'pub') return; if (rest[k] === null) delete hashNow[k]; else hashNow[k] = nh[k]; });
  st.pubHash = hashNow; st.pubAt = vNow; save();
  setBusyText('Guardando tu copia en la nube…');
  await privPush(st);
  st.dirty = false; save(true);
  return { cambios: nKeys, v: vNow };
}
async function despublicarTodo(st) { await dbCall('DELETE', 'catalogos/' + st.slug); st.pubHash = {}; st.pubAt = 0; st.dirty = true; save(); }

/* ---------- copia privada en la nube (multi-dispositivo) ---------- */
var CFG_KEYS = ['slug', 'nombre', 'frase', 'sobre', 'color', 'logo', 'portada', 'wa', 'dir', 'lat', 'lng', 'hor', 'esp', 'cierre', 'msgCierre', 'redes', 'mp', 'ms', 'tasaFuente', 'tasas', 'margen', 'pagos', 'nota', 'rec', 'zonas', 'umbral', 'cats', 'fotosMap', 'flags', 'created', 'u', 'slugOK'];
function cfgDe(st) { var o = {}; CFG_KEYS.forEach(function (k) { if (st[k] !== undefined) o[k] = st[k]; }); return o; }
async function privPush(st) {
  var base = 'usuarios/' + APP.auth.uid + '/tiendas/' + st.id, body = {}, nh = {};
  var cfg = cfgDe(st), ch = hash32(JSON.stringify(cfg)); nh.cfg = ch; if (st.privHash.cfg !== ch) body.cfg = cfg;
  st.prods.forEach(function (p, i) { var k = 'prods/' + p.id, cp = Object.assign({}, p, { ord: i }), h = hash32(JSON.stringify(cp)); nh[k] = h; if (st.privHash[k] !== h) body[k] = cp; });
  Object.keys(st.privHash).forEach(function (k) { if (k !== 'cfg' && !(k in nh)) body[k] = null; });
  var hashNow = Object.assign({}, st.privHash);
  await patchPorLotes(base, body, 60, function (ks) { ks.forEach(function (k) { if (body[k] === null) delete hashNow[k]; else hashNow[k] = nh[k]; }); });
  var rev = Date.now(); await dbCall('PATCH', base, { rev: rev, owner: APP.auth.uid, slug: st.slug });
  st.privHash = hashNow; st.rev = rev; st.syncAt = rev; st.borrados = {}; save();
}
function aplicarNube(st, rem, force) {
  var d = nuevaTienda(), cambio = false;
  if (rem.cfg && (force || num(rem.cfg.u) > num(st.u))) { CFG_KEYS.forEach(function (k) { st[k] = rem.cfg[k] !== undefined ? rem.cfg[k] : d[k]; }); cambio = true; }
  var remP = rem.prods || {}, map = {}; st.prods.forEach(function (p) { map[p.id] = p; });
  var borr = st.borrados || {};
  Object.keys(remP).forEach(function (id) {
    if (borr[id]) return;
    var r = remP[id], l = map[id];
    if (!l) { st.prods.push(r); cambio = true; }
    else if (num(r.u) > num(l.u)) { st.prods[st.prods.indexOf(l)] = r; cambio = true; }
  });
  var antes = st.prods.length;
  st.prods = st.prods.filter(function (p) { return remP[p.id] || num(p.u) > st.syncAt || !st.privHash['prods/' + p.id]; });
  if (st.prods.length !== antes) cambio = true;
  if (cambio) {
    st.prods.forEach(function (p, i) { if (p.ord == null) p.ord = 1e6 + i; });
    st.prods.sort(function (a, b) { return a.ord - b.ord; }); migrar(st);
    st.prods.forEach(function (p) { delete p.ord; });
  }
  return cambio;
}
async function privPull(st, force) {
  var base = 'usuarios/' + APP.auth.uid + '/tiendas/' + st.id;
  var rev = await dbGet(base + '/rev'); if (rev == null) return false;
  if (!force && rev === st.rev) return false;
  var rem = await dbGet(base); if (!rem) return false;
  var c = aplicarNube(st, rem, force); st.rev = rev; st.syncAt = Math.max(st.syncAt, Date.now() - 1);
  if (c) { st.privHash = {}; st.dirty = true; }
  save(); return c;
}
async function tiendasEnNube() {
  var ids = await dbGet('usuarios/' + APP.auth.uid + '/tiendas', false, 'shallow=true'); return ids ? Object.keys(ids) : [];
}
async function restaurarDeNube() {
  var ids = await tiendasEnNube(), n = 0;
  for (var i = 0; i < ids.length; i++) {
    if (APP.stores.some(function (s) { return s.id === ids[i]; })) continue;
    var rem = await dbGet('usuarios/' + APP.auth.uid + '/tiendas/' + ids[i]); if (!rem || !rem.cfg) continue;
    var st = nuevaTienda(); st.id = ids[i]; st.owner = APP.auth.uid; aplicarNube(st, rem, true); st.rev = rem.rev || 0; st.syncAt = Date.now(); st.dirty = false; st.slugOK = true;
    st.prods.forEach(function (p) { p.fotos = p.fotos || []; });
    APP.stores.push(st); n++;
    try { await pullOrders(st); } catch (e) { }
  }
  if (n && !APP.cur) APP.cur = APP.stores[0].id; save(true); return n;
}

/* ---------- pedidos y métricas ---------- */
async function pullOrders(st) {
  if (!hayNube() || !logged() || !st.slugOK) return 0;
  var last = st.pedidos.reduce(function (m, p) { return p.c > m ? p.c : m; }, '');
  var q = last ? 'orderBy=' + enc('"$key"') + '&startAt=' + enc('"' + last + '"') : '';
  var d = await dbGet('pedidos/' + st.slug, false, q); if (!d) return 0;
  var nuevos = 0, mapa = {}; st.pedidos.forEach(function (p) { mapa[p.c] = p; });
  Object.keys(d).forEach(function (k) {
    var r = d[k]; if (!r || !r.c) return; var l = mapa[r.c];
    if (!l) { r.es = r.es || 'nuevo'; r.leido = false; st.pedidos.push(r); if (r.es === 'nuevo') nuevos++; }
    else if (num(r.eu) > num(l.eu)) { l.es = r.es; l.eu = r.eu; }
  });
  st.pedidos.sort(function (a, b) { return a.c < b.c ? 1 : -1; });
  if (nuevos) save(); return nuevos;
}
async function setEstadoPedido(st, ped, es) {
  var antes = ped.es; ped.es = es; ped.eu = Date.now(); ajustarStock(st, ped, antes, es); save();
  if (hayNube() && logged() && st.slugOK) {
    try { await dbCall('PATCH', 'pedidos/' + st.slug + '/' + ped.c, { es: es, eu: ped.eu }); ped.pend = false; }
    catch (e) { ped.pend = true; toast('Estado guardado en el teléfono; se sincronizará luego.', '', 3500); }
    save();
  }
}
function ajustarStock(st, ped, antes, es) {
  var consume = (es === 'confirmado' || es === 'entregado'), yaConsumido = !!ped.desc;
  if (consume && !yaConsumido) { moverStock(st, ped, -1); ped.desc = true; }
  else if (es === 'cancelado' && yaConsumido) { moverStock(st, ped, +1); ped.desc = false; }
}
function moverStock(st, ped, signo) {
  (ped.it || []).forEach(function (i) {
    var p = prodById(st, i.id); if (!p) return;
    var o = i.o && p.opciones.filter(function (x) { return x.id === i.o; })[0];
    if (o && o.st !== '' && o.st != null) { o.st = Math.max(0, num(o.st) + signo * num(i.q)); p.u = Date.now(); }
    else if (p.st !== '' && p.st != null) { p.st = Math.max(0, num(p.st) + signo * num(i.q)); p.u = Date.now(); }
  });
  touch(st);
}
async function pullMetricas(st, dias) {
  var from = ahoraHabana(new Date(Date.now() - dias * 86400000)).dia;
  var d = await dbGet('metricas/' + st.slug, false, 'orderBy=' + enc('"$key"') + '&startAt=' + enc('"' + from + '"'));
  return d || {};
}
async function reintentarPendientes(st) {
  if (!hayNube() || !logged() || !st.slugOK) return;
  for (var i = 0; i < st.pedidos.length; i++) { var p = st.pedidos[i]; if (p.pend) { try { await dbCall('PATCH', 'pedidos/' + st.slug + '/' + p.c, { es: p.es, eu: p.eu }); p.pend = false; } catch (e) { break; } } }
}

function bulkBuscarProductos(q) {
  var st = ST(), qn = norm(q || ''), list = st.prods || [];
  if (!qn) {
    /* Sin texto: no sugerir nada (evita ruido de productos con foto) */
    return [];
  }
  var scored = [];
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    if (!p.nombre) continue;
    var pn = norm(p.nombre), sk = norm(p.sku || '');
    var score = 9999;
    if (pn === qn || sk === qn) score = 0;
    else if (pn.indexOf(qn) === 0) score = 1;
    else if (pn.indexOf(qn) >= 0) score = 2;
    else if (sk.indexOf(qn) >= 0) score = 3;
    else {
      var words = qn.split(' ').filter(function (w) { return w.length > 1; });
      var hit = 0;
      for (var w = 0; w < words.length; w++) { if (pn.indexOf(words[w]) >= 0) hit++; }
      if (hit && hit === words.length) score = 4;
      else if (hit >= 1) score = 5 + (words.length - hit);
    }
    if (score < 9999) scored.push({ p: p, score: score });
  }
  scored.sort(function (a, b) { return a.score - b.score || ((a.p.fotos && a.p.fotos.length ? 1 : 0) - (b.p.fotos && b.p.fotos.length ? 1 : 0)); });
  return scored.slice(0, 8).map(function (x) { return x.p; });
}

function leerPedidosWA(st, txt) {

      var id = par.slice(0, k); try { id = decodeURIComponent(id); } catch (e) { }
      var q = Math.max(1, parseInt(par.slice(k + 1), 10) || 1), p = prodById(st, id), cur = p ? monedaDe(st, p) : st.mp, pr = 0;
      if (p) { pr = precioVigente({ p: num(p.precio), of: num(p.ofertaPrecio) > 0 ? { p: num(p.ofertaPrecio), h: p.ofertaFin } : null }, hoy).precio; if (m[4] === 'T' && ratioTransf(st, p)) pr = Math.round(pr * ratioTransf(st, p) * 100) / 100; }
      it.push({ id: id, n: p ? p.nombre : ((lineas[i] && lineas[i].n) || 'Producto'), o: '', on: '', q: q, p: pr, m: cur });
      tot[cur] = (tot[cur] || 0) + pr * q;
    });
    if (!it.length) continue;
    var ts = parseInt(code.slice(0, 8), 36), ahora = Date.now(); if (!(ts > 1.5e12 && ts < ahora + 86400000)) ts = ahora;
    var o = { c: code, f: ts, es: 'nuevo', leido: false, mon: st.mp, cl: { n: nm ? nm[1].trim() : 'Cliente', t: '', d: ub ? ub[1].trim() : '' }, it: it, en: { t: 'nota', z: '', p: 0 }, pg: m[4] === 'T' ? 'Transferencia' : '', no: '', tot: tot };

async function crearBackup(conFotos, nivel, parte) {

    if (data.cfg) {

  var fotosOk = 0, fotosFail = 0;
  if (conFotos) {
    var ids = idsBackup();
    if (parte) ids = ids.slice(parte.i * parte.n, (parte.i + 1) * parte.n);
    if (!ids.length) {
      console.warn('[backup] No hay IDs de fotos en la tienda');
    }

          var peso = mb < 0.1 ? Math.round((nr.size || 0) / 1024) + ' KB' : mb.toFixed(1) + ' MB';
          var extra = conFotos ? (' · ' + (nr.fotosOk || 0) + ' foto(s) · ' + peso) : (' · ' + peso);
          if (conFotos && !(nr.fotosOk > 0) && idsBackup().length > 0) {
            toast('Copia nativa SIN fotos' + extra, 'bad', 7000);
          } else {
            toast('Copia nativa ✓' + extra, 'ok', 5000);
          }
          refresh();
          return;
        } catch (ne) {
          console.warn('[backup nativo]', ne);
          toast('Nativo falló (' + ((ne && ne.message) || ne) + '). Probando modo web…', 'bad', 3500);
          /* sigue al flujo JS de abajo */
        }
      }
      done = busy(conFotos ? 'Preparando la copia con fotos…' : 'Preparando la copia…');
      var TANDA = 200, n = conFotos && nivel === 'completa' ? idsBackup().length : 0, partes = n > TANDA ? Math.ceil(n / TANDA) : 1, base = 'catalogo-copia-' + ((st && st.slug) || 'tienda') + '-' + new Date().toISOString().slice(0, 10) + (conFotos ? (nivel === 'completa' ? '' : '-miniaturas') : '-sin-fotos'), r = '';
      var totalFotos = 0, ultimoMb = 0;
      for (var k = 0; k < partes; k++) {
        var blob = await crearBackup(conFotos, nivel, partes > 1 ? { i: k, n: TANDA } : null), nom = base + (partes > 1 ? '-parte-' + (k + 1) + '-de-' + partes : '') + '.zip';
        totalFotos += (blob._fotosOk || 0);
        ultimoMb = blob.size / 1048576;
        done(); done = function () { };
        setBusyText('Guardando / compartiendo… ' + (ultimoMb < 0.1 ? Math.round(blob.size / 1024) + ' KB' : ultimoMb.toFixed(1) + ' MB'));
        r = await guardarArchivo(blob, nom, 'Copia del Catálogo de Productos' + (partes > 1 ? ' (parte ' + (k + 1) + ' de ' + partes + ')' : ''));
        if (r === 'cancelado') break;
        if (k < partes - 1) { toast('Parte ' + (k + 1) + ' de ' + partes + ' lista. Sigue la siguiente…', '', 2500); done = busy('Preparando la parte ' + (k + 2) + ' de ' + partes + '…'); }
      }
      if (r !== 'cancelado') {
        APP.cfg.lastBackup = Date.now(); save(true);
        var peso = ultimoMb < 0.1 ? Math.round(ultimoMb * 1024) + ' KB' : ultimoMb.toFixed(1) + ' MB';
        var extra = conFotos ? (' · ' + totalFotos + ' foto(s) · ' + peso) : (' · ' + peso);
        if (conFotos && totalFotos === 0) {
          toast('Copia creada pero SIN fotos' + extra + '. Las fotos no se pudieron leer del almacenamiento.', 'bad', 7000);
        } else {
          toast((partes > 1 ? 'Copia en ' + partes + ' partes ✓' : 'Copia ' + (r || 'lista') + ' ✓') + extra, 'ok', 5000);
        }
        refresh();
      }
    } catch (e) {
      done();
      var msg = (e && e.message) ? String(e.message) : 'No se pudo crear la copia';
      if (/memory|heap|out of|alloc|quota|NS_ERROR_OUT_OF_MEMORY/i.test(msg) || (e && e.name === 'QuotaExceededError')) {
        msg = 'Memoria insuficiente. Elige «Miniaturas» o «Copia sin fotos».';
      }
      toast(msg, 'bad', 6500);
    }
  };
  ACT['bk-restaurar'] = async function () {
    var f = await elegirArchivo('.zip,application/zip,application/octet-stream'); if (!f) return;
    if (!(await confirmar('¿Restaurar esta copia?', 'Restaurar', false, 'Las tiendas de la copia reemplazan a las que tengan el mismo identificador.'))) return;
    await snapGuardar(true); var done = busy('Restaurando…');
    try { var r = await restaurarBackup(f); done(); toast('Restauradas ' + r.tiendas + ' tienda(s) y ' + r.fotos + ' foto(s) ✓'); go('/'); } catch (e) { done(); toast(e.message || 'No se pudo restaurar', 'bad', 5000); }
  };
  ROUTES.unshift([/^\/respaldo$/, function () {
    var st = ST(), n = st ? st.prods.length : 0, ult = APP.cfg.lastBackup || 0, viejo = !ult || Date.now() - ult > 7 * 864e5;
    var body = html`<div class="pg stack">
      <div class="card"><h2>Copia de seguridad</h2>
        <p class="help" style="margin:0 0 8px">Tus datos viven solo en este teléfono. Si cambias de teléfono, desinstalas la app o borras los datos, se pierden. Guarda una copia fuera de aquí (Telegram, Drive, WhatsApp o la PC).</p>
        <p style="margin:0 0 10px"><span class="chip ${viejo ? 'bad' : 'ok'}">Última copia: ${fecha(ult)}</span> <span class="help">· ${n} productos</span></p>
        <div class="wr"><button class="btn pri sm" data-act="bk-crear" data-v="1">Copia con fotos</button><button class="btn sm" data-act="bk-crear" data-v="0">Copia sin fotos</button></div>
        <p class="help" style="margin:8px 0 0">Con fotos incluye miniaturas de los productos usados (para no cerrar la app). Sin fotos es más rápida. Las fotos a tamaño completo ya publicadas siguen en GitHub. La copia no incluye claves ni el token.</p></div>
      <div class="card"><h2>Restaurar una copia</h2><p class="help" style="margin:0 0 8px">Elige un archivo .zip creado con este panel. Se actualizan las tiendas que coinciden y se agregan las demás.</p><button class="btn sm" data-act="bk-restaurar">Elegir copia…</button></div>
      <div class="card"><h2>Copias automáticas del teléfono</h2><p class="help" style="margin:0 0 6px">El panel guarda solo las últimas 3 (una cada 6 horas). Sirven si algo se daña, pero no si cambias de teléfono: para eso haz la copia de arriba.</p><div id="bk-lista"></div></div></div>`;
    return { title: 'Copia de seguridad', back: '/menu', nav: 'menu', body: body, after: pintarSnaps };
  }]);
  var _bp = bannerPublicar;
  bannerPublicar = function (st) { var u = APP.cfg.lastBackup || 0, d = u ? Math.floor((Date.now() - u) / 864e5) : null; var av = (st && st.prods && st.prods.length && (d === null || d >= 7)) ? html`<a class="banner warn" style="display:block;text-decoration:none;color:#7a4a00" href="#/respaldo"><b>${d === null ? 'Aún no has hecho una copia de seguridad.' : 'Hace ' + d + ' días que no haces copia de seguridad.'}</b> Toca para guardarla.</a>` : ''; return html`${av}${_bp(st)}`; };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  setTimeout(snapGuardar, 4000); document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') snapGuardar(); });
  window.panelBk = { snapGuardar: snapGuardar, snapLista: snapLista };
})();
</script>
<script>
/* ===== Pedidos y visitas desde la web (Firebase Realtime Database, REST) ===== */
(function () {
  function cfg() { return APP.cfg.fb || {}; }
  function listo() { var c = cfg(); return !!(c.url && c.key && c.email && c.pass); }
  var TK = null;
  async function fbToken() {
    var c = cfg(); if (TK && TK.k === c.key + c.email + c.pass && Date.now() < TK.exp - 60000) return TK.t;
    var r; try { r = await fetchT('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(c.key), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: c.email, password: c.pass, returnSecureToken: true }) }); }
    catch (e) { throw new Error('No hay conexión con Firebase.'); }
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok) { var m = String((j.error && j.error.message) || '').split(' ')[0]; throw new Error(/INVALID|EMAIL_NOT_FOUND|PASSWORD/.test(m) ? 'Correo o contraseña de Firebase incorrectos.' : m === 'OPERATION_NOT_ALLOWED' ? 'En Firebase activa «Correo y contraseña» en Authentication.' : 'Error de Firebase: ' + (m || r.status)); }
    TK = { t: j.idToken, exp: Date.now() + (+j.expiresIn || 3600) * 1000, k: c.key + c.email + c.pass }; return TK.t;
  }
  async function fbGet(path) {
    var t = await fbToken(), r; try { r = await fetchT(String(cfg().url).replace(/\/+$/, '') + '/' + path + '.json?auth=' + encodeURIComponent(t), {}, 25000); } catch (e) { throw new Error('Sin conexión con la base de datos.'); }
    if (r.status === 401 || r.status === 403) throw new Error('Sin permiso: pega las reglas en Firebase (Copiar reglas) y publícalas.');
    if (!r.ok) throw new Error('Error de la base de datos (' + r.status + ').'); return r.json();
  }
  var ultimo = 0;
  async function sync() {
    var st = ST(); if (!st || !listo()) return { n: 0 };
    if (!st.slug) throw new Error('Tu tienda aún no tiene dirección (slug). Publica el catálogo primero.');
    var ped = await fbGet('pedidos/' + encodeURIComponent(st.slug)) || {}, vis = await fbGet('visitas/' + encodeURIComponent(st.slug)) || {}, n = 0;
    st.vis = vis;
    Object.keys(ped).forEach(function (k) {
      var rec = ped[k]; if (!rec || typeof rec.txt !== 'string') return;
      leerPedidosWA(st, rec.txt).forEach(function (o) { if (!st.pedidos.some(function (x) { return x.c === o.c; })) { st.pedidos.push(o); n++; } });
    });
    st.pedidos.sort(function (a, b) { return a.c < b.c ? 1 : -1; }); ultimo = Date.now(); save(true); return { n: n };
  }
  window.fbListo = listo;
  window.fbVisitas = function (st, dias) {
    var v = st.vis || {}, lim = new Date(Date.now() - (dias - 1) * 864e5), d = lim.getFullYear() + '-' + String(lim.getMonth() + 1).padStart(2, '0') + '-' + String(lim.getDate()).padStart(2, '0'), t = 0;
    Object.keys(v).forEach(function (k) { if (k >= d) t += num(v[k]); }); return t;
  };
  var orig = ACT['ped-sync'];
  ACT['ped-sync'] = async function () {
    if (listo()) {
      var done = busy('Buscando pedidos…');
      try { var r = await sync(); done(); toast(r.n ? r.n + (r.n === 1 ? ' pedido nuevo' : ' pedidos nuevos') : 'No hay pedidos nuevos'); refresh(); return; }
      catch (e) { done(); toast(e.message, 'bad', 5000); }
    }
    return orig.apply(this, arguments);
  };
  ACT['fb-test'] = async function () {
    var done = busy('Probando…');
    try { var r = await sync(); done(); toast('Conectado ✓ · ' + r.n + ' pedido(s) nuevo(s)', '', 4000); refresh(); } catch (e) { done(); toast(e.message, 'bad', 5500); }
  };
  ACT['fb-reglas'] = function () {
    var em = (cfg().email || 'TU_CORREO').replace(/'/g, ''), ok = "auth != null && auth.token.email === '" + em + "'";
    var r = { rules: { '.read': false, '.write': false,
      visitas: { $slug: { '.read': ok, $dia: { '.write': true, '.validate': "newData.isNumber() && newData.val() === (data.exists() ? data.val() : 0) + 1" } } },
      pedidos: { $slug: { '.read': ok, $cod: { '.write': '!data.exists() && newData.exists()', '.validate': "newData.hasChildren(['t','txt']) && newData.child('t').isNumber() && newData.child('txt').isString() && newData.child('txt').val().length < 6000" } } } } };
    copiar(JSON.stringify(r, null, 2));
  };
  document.addEventListener('change', function (e) { var f = e.target.getAttribute && e.target.getAttribute('data-f'); if (f && f.indexOf('fb.') === 0) { TK = null; touch(); } });
  function auto() { if (!listo() || !ST() || Date.now() - ultimo < 120000) return; sync().then(function (r) { if (r.n) toast(r.n + (r.n === 1 ? ' pedido nuevo' : ' pedidos nuevos')); if (/^#?\/?(pedidos)?$/.test(location.hash)) refresh(); }).catch(function () { }); }
  setTimeout(auto, 4000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') auto(); });
})();
</script>
