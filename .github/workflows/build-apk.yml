name: Compilar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar dependencias
        run: npm install
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Permitir conexion al servidor de pedidos (http en la red local)
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml && grep -n usesCleartextTraffic android/app/src/main/AndroidManifest.xml
      - name: Icono de la app
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Numero de version
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Sincronizar y compilar
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Catalogo-de-Productos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
