name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Comprobar keystore en el repo
        run: |
          if [ ! -f debug.keystore ]; then
            echo "ERROR: falta debug.keystore en la RAÍZ del repo."
            exit 1
          fi
          ls -la debug.keystore

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick || true

      - name: Instalar dependencias npm
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Cleartext HTTP
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true

      - name: Icono de la app
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            echo "convert no disponible; iconos por defecto"
            exit 0
          fi
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}
            s=${d##*:}
            mkdir -p android/app/src/main/res/mipmap-$n
            convert icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
            cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true

      - name: Firma fija
        run: |
          mkdir -p ~/.android android/app
          cp -f debug.keystore ~/.android/debug.keystore
          cp -f debug.keystore android/app/debug.keystore
          ls -la ~/.android/debug.keystore android/app/debug.keystore
          if [ -f android/app/build.gradle ] && ! grep -q signingConfigs android/app/build.gradle; then
            sed -i 's/buildTypes {/signingConfigs {\n        debug {\n            storeFile file('\''debug.keystore'\'')\n            storePassword '\''android'\''\n            keyAlias '\''androiddebugkey'\''\n            keyPassword '\''android'\''\n        }\n    }\n    buildTypes {/' android/app/build.gradle
            sed -i 's/debug {/debug {\n            signingConfig signingConfigs.debug/' android/app/build.gradle
            echo "signingConfigs anadido"
          fi

      - name: Numero de version
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Inyectar plugin CatalogoBackup
        continue-on-error: true
        run: |
          if [ -f scripts/inject-backup-plugin.sh ]; then
            bash scripts/inject-backup-plugin.sh
          else
            echo "scripts/inject-backup-plugin.sh no esta; se omite"
          fi

      - name: Inyectar plugin Nativo
        continue-on-error: true
        run: |
          if [ -f scripts/inject-nativo.sh ]; then
            bash scripts/inject-nativo.sh
          else
            echo "scripts/inject-nativo.sh no esta; se omite"
          fi

      - name: Optimizar WebView
        continue-on-error: true
        run: |
          if [ -f scripts/inject-perf.sh ]; then
            bash scripts/inject-perf.sh
          else
            echo "scripts/inject-perf.sh no esta; se omite"
          fi

      - name: Compilar APK
        run: |
          cp -f debug.keystore android/app/debug.keystore
          cp -f debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon --stacktrace; then
            echo "Reintentando sin plugin Nativo..."
            cd ..
            if [ -f scripts/quitar-nativo.sh ]; then bash scripts/quitar-nativo.sh || true; fi
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Verificar firma del APK
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          KS=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AP=$("$BT"/apksigner verify --print-certs "$APK" | grep -m1 "SHA-256 digest" | sed 's/.*: *//' | tr -d ' :' | tr 'A-F' 'a-f')
          echo "Huella de debug.keystore (repo): $KS"
          echo "Huella con la que quedo firmado el APK: $AP"
          echo "versionCode / versionName del APK:"
          "$BT"/aapt2 dump badging "$APK" | grep -m1 "package:" || true
          if [ -n "$KS" ] && [ "$KS" = "$AP" ]; then
            echo "FIRMA OK: el APK esta firmado con debug.keystore del repo"
          else
            echo "::error::El APK NO esta firmado con debug.keystore del repo"
            exit 1
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Catalogo-de-Productos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
